[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boltzmann-leadopt-environment"
version = "0.1.0"
description = "Advisory small-molecule lead-optimization campaign environment for Agent-Scientist"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
leadopt-env = "leadopt_env.cli:main"

[project.entry-points."sci_agent.plugins"]
leadopt_env = "leadopt_env.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leadopt_env = ["plugin.yaml", "skills/**/*.md"]
