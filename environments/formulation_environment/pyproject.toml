[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "science-formulation-environment"
version = "0.1.0"
description = "Evidence-gated formulation task benchmarks; no validated product predictor"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<3", "pandas>=3,<4", "scipy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
