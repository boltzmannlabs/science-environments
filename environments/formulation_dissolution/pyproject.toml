[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "formulation-optimization-gym"
version = "0.1.0"
description = "Evidence-first ranolazine ER formulation investigation and dissolution-modelling environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Base code and the default test suite use only the Python standard library.
# These extras are needed only for the OpenPKFlow-backed kinetic-fitting
# workflows (six_model_pipeline, openpkflow_probe, exploratory scenarios) and
# the optional tests that are skipped when OpenPKFlow is absent.
simulation = ["openpkflow==2.9.0", "matplotlib>=3.7", "pandas>=2.0", "scipy>=1.10"]
test = ["pytest>=8"]

[project.scripts]
formulation-gym = "run:main"
formulation-history = "cli:main"
formulation-simulate = "simulation:main"

# The environment is a flat package (top-level modules), not a src/ layout.
# This reuses the existing implementation rather than duplicating it;
# see ENVIRONMENT_SPEC.md section 10 for the module map to the proposed layout.
[tool.setuptools]
py-modules = ["run", "cli", "simulation", "import_fda", "import_dailymed"]
packages = ["environment", "agents", "models", "tools", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
