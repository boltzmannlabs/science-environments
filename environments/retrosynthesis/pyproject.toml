[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrosynthesis"
version = "0.1.0"
description = "Evidence-aware, inventory-constrained synthesis research environment"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3", "rdkit>=2022.9", "numpy>=1.24", "scikit-learn>=1.3", "httpx>=0.25", "PyYAML>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8", "pytest-cov>=5"]
search = ["syntheseus==0.8.0"]

[project.scripts]
retrosynthesis = "synthesis_route_gym.cli:main"
synthesis-route-gym = "synthesis_route_gym.cli:main"

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["synthesis_route_gym"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
