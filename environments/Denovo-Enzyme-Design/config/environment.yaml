schema_version: "2.0"
environment_id: denovo-enzyme-design
maturity: Specification
scientific_execution_included: false
qualified_profiles_included: false

scope:
  protein_form: soluble
  supported_assemblies: [monomer, homodimer]
  request_assembly_fallback: resolve_from_evidence
  cofactors: none
  require_qualified_reaction_profile: true
  unsupported_science_status: PROTOCOL_REQUIRED
  user_information_status: NEEDS_INPUT
  infrastructure_status: BLOCKED

contracts:
  request: config/request.schema.json
  protocol: config/protocol.schema.json
  task: tasks/denovo_enzyme_001.md

version_policy:
  immutable_code_or_container_reference: required
  model_weight_checksums: required_when_used
  dataset_snapshot_identifiers: required_when_used
  runtime_input_and_evidence_hashes: required
  inherited_model_latest_tags: forbidden

required_rule_groups:
  - reaction_identity
  - reactive_geometry
  - protonation_and_stabilization
  - states_and_chemical_steps
  - fold_and_physical_integrity
  - solubility
  - aggregation
  - operating_compatibility
  - assembly_and_interface

stages:
  - id: prepare
    depends_on: []
    capabilities: [chemical_normalization, biological_assembly_resolution, qualified_profile_resolution]
    output: 00_inputs
  - id: generate
    depends_on: [prepare]
    capabilities: [constrained_scaffold_and_sequence_generation]
    homodimer_capabilities: [assembly_scaffold_generation, tied_sequence_design]
    output: 01_designs
  - id: sequence_screen
    depends_on: [generate]
    capabilities: [sequence_validation, solubility_prediction, thermal_endpoint_prediction, pH_endpoint_prediction]
    output: 02_sequences
  - id: fold
    depends_on: [sequence_screen]
    capabilities: [independent_fold_prediction, scaffold_and_catalytic_site_comparison]
    homodimer_capabilities: [independent_full_assembly_prediction, interface_evidence_assessment, per_chain_and_site_checks]
    output: 03_folds
  - id: aggregation
    depends_on: [fold]
    capabilities: [structural_aggregation_and_hotspot_assessment]
    homodimer_capabilities: [assembled_surface_assessment, profile_defined_dissociated_surface_assessment]
    output: 04_properties
  - id: complex
    depends_on: [aggregation]
    capabilities: [enzyme_substrate_complex_prediction, reactive_pose_assessment]
    output: 05_complexes
  - id: catalytic_states
    depends_on: [complex]
    capabilities: [state_ensemble_assessment, protonation_assessment, catalytic_geometry_evaluation]
    output: 06_states
  - id: chemistry
    depends_on: [catalytic_states]
    capabilities: [conformational_sampling, coupled_quantum_mechanical_evaluation, profile_defined_energy_or_free_energy_validation]
    output: 07_chemistry
  - id: evaluate
    depends_on: [chemistry]
    capabilities: [independent_frozen_gate_evaluation, diversity_clustering_and_ranking]
    output: 08_results

assembly_contract:
  unique_sequences_per_candidate: 1
  length_basis: per_unique_sequence
  candidate_count_basis: complete_assembly
  biological_assembly_evidence: required
  chain_and_site_mapping: required
  homodimer_chain_sequences: identical
  state_symmetry_and_occupancy: profile_defined
  independent_assembly_evidence: required_for_homodimer
  average_cannot_hide_required_site_failure: true
  interface_confidence_is_catalysis: false
  qualification_scope: computational_only
  concentration_and_solution_domain: resolve_when_required_by_claim
  concentration_basis: explicit_when_concentration_supplied
  kinetic_comparison_basis: explicit_and_matched
  site_rules: state_specific
  prediction_templates_and_restraints: disclosed
  design_provenance_and_reference_similarity: required

refinement:
  capabilities: [constrained_structure_refinement, constrained_sequence_refinement]
  new_candidate_id: required
  preserve_fixed_catalytic_groups: true
  preserve_assembly_and_tied_sequences: true
  invalidate_changed_candidate_evidence: true

qualification:
  required_rule_combiner: all
  evidence_must_be_current: true
  allowed_rule_states: [PASS, FAIL, UNRESOLVED]
  missing_raw_value: null
  unresolved_can_qualify: false
  fail_can_qualify: false
  score_compensation_across_hard_rules: false
  return_failed_to_fill_shortlist: false
  successful_run_statuses: [QUALIFIED, PARTIAL, NO_QUALIFYING_DESIGNS]

controller:
  default_mode: fixed
  supported_modes: [fixed, rl_inference, rl_training]
  rl_learning_method: profile_defined_with_action_masking
  episode_unit: candidate_lineage
  training_split: development_only
  inference_policy: frozen
  held_out_policy: frozen
  actions: [generate, refine, evaluate_stage, discard, stop]
  immutable_to_policy: [reaction, catalytic_groups, assembly, chain_mapping, site_coverage, protocol, gates, reward_definition, required_stages, chemistry_reservation]
  reward:
    per_required_rule_positive_weight: true
    weight_sum: 1.0
    score_range: [0.0, 1.0]
    unresolved_potential_contribution: 0.0
    progress_coefficient: 0.1
    cost_coefficient: 0.1
    terminal_all_pass: 2.0
    terminal_verified_failure: -1.0
    terminal_incomplete: 0.0
    gamma: 1.0
    maximum_total_normalized_episode_cost: 1.0
  assembly_decisions:
    before_promotion: required
    evidence_and_reason: required
    missing_or_conflicting_evidence: unresolved
    technical_retry: bounded_by_frozen_policy
    method_switching_until_pass: forbidden
    reject_or_refine_verified_failure: true
  artifacts: 09_rl

budgets:
  source: resolved_request_and_qualified_profile
  enforce_before_dispatch: true
  reserve_finalist_chemistry: true
  charge_retries: true
  estimate_full_assembly_and_site_coverage: true
  relax_gates_when_exhausted: false

benchmark:
  baselines: [fixed_execution, rule_based_refinement, frozen_rl]
  equal_total_compute: true
  independent_frozen_evaluator: true
  held_out_training_forbidden: true
  report_rl_training_cost_separately: true
