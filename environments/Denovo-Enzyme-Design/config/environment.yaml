schema_version: "2.0"
environment_id: denovo-enzyme-design
maturity: In Progress
execution_controller_included: true
scientific_execution_included: false
qualified_profiles_included: false

scope:
  protein_form: soluble
  supported_assemblies: [monomer, homodimer]
  request_assembly_fallback: resolve_from_evidence
  cofactors: none
  generation_requires_reviewed_generation_contract: true
  qualification_requires_qualified_reaction_profile: true
  unsupported_science_status: BLOCKED
  missing_scientific_prerequisite_reason: PROTOCOL_REQUIRED
  user_information_status: NEEDS_INPUT
  infrastructure_status: BLOCKED

contracts:
  request: config/request.schema.json
  generation: config/generation.schema.json
  protocol: config/protocol.schema.json
  task: src/TASK.md

autonomy:
  policy_version: "2.0"
  user_interface: short_scientific_request_and_available_inputs
  request_schema_applies_to: agent_resolved_execution_request
  routine_human_approval: false
  scientific_preparation_owner: agent
  scientific_target: resolved_separately_for_each_request
  example_biology_is_default: false
  cross_target_profile_reuse: applicability_review_and_current_request_binding_required
  stage_review_owner: agent_with_evidence_evaluator
  review_required_before_next_stage: true
  review_uses_current_artifact_hashes_and_rule_evidence: true
  missing_profile_action: prepare_and_test_draft
  preparation_tasks_without_qualified_profile:
    - reference_and_reaction_preparation
    - bounded_adapter_fixture_tests
    - bounded_reference_and_control_calculations
  preparation_requires_test_specific_inputs_and_resource_checks: true
  preparation_outputs_are_qualified_designs: false
  generation_entry: reviewed_generation_contract
  full_profile_required_for: final_qualification
  late_missing_capability: finish_eligible_work_then_partial
  scientific_status_is_a_dispatch_permission: false
  reuse_existing_harness: true
  dependency_setup: only_within_frozen_tool_execution_policy
  missing_adapter_action: repair_transport_within_policy_or_report_capability_gap
  tool_discovery: connected_catalogs_and_verified_executor_contracts
  tool_selection: frozen_condition_specific_execution_policy
  prescribed_tool_replacement: preserve_explicit_test_condition
  defaults_precedence: explicit_user_requirements_then_run_policy_then_evidence_backed_assumptions
  scientific_defaults: documented_reference_conditions_and_method_applicability
  require_default_provenance: true
  qualification_requires_actual_evidence: true
  reviewer_opinion_can_override_failed_or_unresolved_gate: false
  optional_characterization_missing_blocks_run: false
  user_question_reasons:
    - essential_goal_or_reaction_ambiguity_unresolvable_from_evidence
    - required_access_or_resources_outside_existing_authorization
    - incompatible_explicit_user_requirements
  missing_capability_action: finish_independent_work_then_report_specific_blocker
  resolution_record: resolution_decisions.json
  review_record: trajectory.jsonl
  review_actions: [accept, accept_sequence_only, retry, repair, reject, blocked, needs_input]
  persistent_recovery: true
  whole_run_entrypoint: scripts/run.py
  user_questions_require_structured_reviewed_reason: true
  routine_question_action: bounded_internal_repair
  resume_requires_current_input_and_artifact_hashes: true
  repair_invalidates_affected_downstream_evidence: true
  fallback_pilot:
    purpose: conservative_local_development_ceiling_not_completion_estimate
    controller_mode: fixed
    seed: 42
    final_count: 1
    max_generated: 2
    max_refinements_per_lineage: 0
    max_chemistry_candidates: 1
    budget:
      wall_time_hours: 2
      cpu_core_hours: 16
      gpu_hours: 1
    max_concurrent_scientific_jobs: 1
    external_service_use: within_existing_authorized_entitlements_and_caps_only
    additional_service_spend_usd: 0
    includes_preparation_controls_retries_and_candidate_work: true
    setup_accounting: separate_within_same_total_limits
    wall_accounting: active_controller_and_job_time
    respect_explicit_absolute_deadline: true
    expired_historical_allowance_is_reusable: false
    automatically_extend_limits: false

tool_execution:
  policy_version: "1.1"
  real_execution_required: true
  completed_scientific_stage_requires_execution_evidence_artifact: true
  runtime_checks: [stage_condition_policy_binding, permitted_declared_route, job_command_or_captured_invocation, hashed_receipt_inputs_and_raw_outputs, python_purpose_scope, chemistry_exception_scope]
  prediction_stages: [generate, sequence_screen, fold, aggregation, chemistry]
  real_execution_evidence:
    - actual_provider_tool_identity_and_version_or_disclosed_backend_version_gap
    - hashed_inputs_and_recorded_parameters
    - actual_job_id_local_command_or_captured_invocation_and_execution_receipt
    - terminal_status_and_hashed_raw_outputs
    - independently_reviewed_applicability_controls_and_uncertainty
  discovery_is_execution: false
  fixture_or_mock_is_scientific_result: false
  agent_opinion_is_measurement: false
  scientific_qualification_from_exit_code_alone: false
  primary_providers: [boltzmann, tooluniverse]
  provider_membership_implies_hosted_execution: false
  local_python:
    allowed_purposes: [input_preparation, format_conversion, atom_residue_chain_mapping, numerical_geometry_checks, output_validation, result_analysis]
    model_installation_training_or_inference_reimplementation: forbidden_as_automatic_fallback
    network_and_subprocess_escape_from_provider_policy: forbidden
    descriptors_replace_property_predictions: false
  external_chemistry:
    permitted_when: required_chemistry_capability_unavailable_through_both_providers
    requirements: [recorded_capability_search, named_method_and_version, scientific_justification, validated_inputs_and_controls, existing_access_and_resource_authorization, independent_review]
    other_prediction_stages_may_use_this_exception: false
  model_internal_changes: separately_versioned_explicit_development_scope_only
  profiles:
    agent_selected:
      selection: discover_and_select_by_capability
      execution_routes: [boltzmann, tooluniverse, local_python_support, external_chemistry]
      local_model_setup: forbidden_as_automatic_fallback
      missing_capability: finish_independent_work_then_report_specific_gap
    tools_specified:
      selection: exact_tools_from_frozen_request_and_input_manifests
      execution_routes: [boltzmann, tooluniverse, prescribed_tool, local_python_support, external_chemistry]
      local_model_setup: only_for_explicitly_prescribed_implementations_within_run_scope
      substitution: only_if_explicitly_permitted_by_frozen_test_condition
      external_chemistry: must_also_preserve_prescribed_test_condition
  run_isolation:
    freeze_condition_policy_runtime_and_instructions_at_init: true
    hot_reload_shared_markdown: false
    migration: explicit_versioned_continuation_preserving_evidence_and_usage
    benchmark_condition_change: new_condition_not_continuation_of_original_comparison
  enforcement_boundary: controller_pins_and_passes_policy_harness_enforces_tool_network_and_subprocess_access_reviewer_checks_execution_evidence

fresh_run:
  default_condition: agent_selected
  use_new_run_directory_and_frozen_environment: true
  resume_old_session_or_controller_state: false
  reuse_reference_inputs: only_after_identity_and_applicability_review
  inherit_old_candidates_predictions_or_pass_flags: false
  old_uncertain_remote_jobs: retain_for_nonduplication_not_automatically_cancelled
  old_allowances: not_reusable
  workflow: discover_ready_executors_then_bounded_generation_and_evaluation
  candidate_sampling: plan_diverse_batch_within_frozen_quotas_and_budget
  fallback_pilot_is_main_campaign: false
  repeated_rescue_of_one_candidate: only_when_evidence_supports_bounded_repair
  missing_late_capability: complete_eligible_work_and_report_partial

startup_validation:
  scope: agent_performs_and_records_joint_startup_checks_before_expensive_inference
  use_actual_run_inputs: true
  hosted_checks: [actual_service_schema_and_access, input_validation_and_mapping, supported_assembly_and_state_inputs, output_and_receipt_contract, job_status_and_resource_limits]
  hosted_private_internals_required: false
  local_runtime_checks: only_for_a_permitted_local_executor_or_explicit_development_scope
  checks_when_applicable:
    - request_and_launch_policy_schema
    - input_parsing_and_feature_construction
    - unique_atom_residue_chain_mapping
    - trusted_checkpoint_loading
    - accelerator_and_runtime_compatibility
    - prediction_framework_and_logging
    - tracer_initialization_and_first_snapshot
  unsupported_checks: record_not_applicable_with_reason
  authorization_source: existing_controller_policy_and_actual_execution_gate
  execution_gate_accepted_decisions: [manual_approval, configured_smart_approval]
  additional_manual_prompt_after_smart_approval: false
  execution_approval_scope: exact_operation_not_blanket_future_authorization
  execution_gate_denial_action: stop_and_preserve_exact_error_without_alternate_route
  expired_deadline_action: stop_without_automatic_renewal
  retry_action: diagnose_version_test_and_retry_within_authorized_limits
  unchanged_failing_invocation_retry: forbidden
  abbreviated_sampling_use: diagnostics_only_unless_quality_equivalence_is_validated
  coordinate_audit: distinguish_initial_noise_placeholders_model_output_and_postprocessing
  motif_mask_validation: preserve_declared_fixed_atoms_and_check_final_covalent_compatibility
  whole_residue_fixing: run_specific_reviewed_choice_not_universal_default
  assembly_capability_validation: demonstrate_compatible_symmetry_motif_and_occupancy_under_supported_sampling
  requested_operator_activation: inspect_local_runtime_if_accessible_otherwise_service_contract_and_bounded_output_controls
  fixed_motif_geometry_scope: all_relevant_covalent_bonds_and_peptide_links_not_selected_contact_distances
  dependent_capability_controls: require_working_simpler_control_or_explicit_independent_diagnostic_rationale

method_validation:
  assessment_contract_version: "2.1"
  evidence_schema_version: "1.0"
  required_before_structural_promotion: true
  independent_models_required_for_all_generation_routes: true
  preparation_alone_passes_fold: false
  revalidate_before_resume_downstream_and_qualification: true
  exploratory_control_and_candidate_predictions_allowed: true
  control_failure_is_candidate_failure: false
  evidence_bound_to_method_settings_plan_and_applicability: true
  controls: task_appropriate_positive_references_and_required_negative_controls
  reference_comparison: verified_sequence_numbering_assembly_and_equivalent_chain_permutations
  candidate_native_interface_identity_required: only_if_explicitly_frozen_in_task
  information_basis: record_actual_alignments_templates_restraints_and_missing_information
  fabricated_alignments_or_reference_evidence: forbidden
  default_parameters: pinned_method_supported_settings_with_recorded_deviations
  sampling_plan: predeclare_on_controls_and_report_all_prespecified_samples
  method_selection: control_evidence_without_candidate_score_cherry_picking
  unsupported_input_regime: unresolved_until_applicability_is_supported
  enzyme_specific_rules_location: run_profile_not_environment_constants
  control_failure_scope: affected_claims_and_dependencies_with_independent_evidence_retained
  richer_information_control_use: diagnostic_only_until_candidate_regime_applicability_is_supported
  candidate_correspondence: generator_motif_atom_provenance_with_structural_review_not_pairwise_alignment_alone
  sequence_property_work: execute_applicable_sequence_based_assessments_independently_of_fold_promotion

version_policy:
  immutable_code_or_container_reference: required_for_accessible_local_implementations
  hosted_service_provenance: provider_service_reported_version_timestamp_hashed_contract_and_reproducibility_limitations
  unknown_hosted_backend_version: disclose_never_fabricate_review_comparability_and_claim_limits
  model_weight_checksums: required_when_used_and_accessible_otherwise_disclose_hosted_gap
  dataset_snapshot_identifiers: required_when_used
  runtime_input_and_evidence_hashes: required
  inherited_model_latest_tags: forbidden

required_rule_groups:
  - reaction_identity
  - reactive_geometry
  - protonation_and_stabilization
  - states_and_chemical_steps
  - fold_and_physical_integrity
  - solubility
  - aggregation
  - operating_compatibility
  - assembly_and_interface

stages:
  - id: prepare
    depends_on: []
    capabilities: [chemical_normalization, biological_assembly_resolution, generation_readiness_resolution]
    entry_requirement: resolvable_scientific_intent_and_existing_access
    output: 00_inputs
  - id: generate
    depends_on: [prepare]
    capabilities: [constrained_scaffold_and_sequence_generation]
    homodimer_capabilities: [assembly_scaffold_generation, tied_sequence_design]
    entry_requirement: reviewed_generation_contract_and_verified_generator_inputs
    output: 01_designs
    sequence_only_fallback: accept_reviewed_sequence_identity_with_hashed_geometry_defect_report_without_claiming_structure_integrity
  - id: sequence_screen
    depends_on: [generate]
    capabilities: [sequence_validation, solubility_prediction, thermal_endpoint_prediction, pH_endpoint_prediction]
    entry_requirement: designed_sequences_and_declared_assembly_mapping_even_if_backbone_geometry_unresolved
    output: 02_sequences
  - id: fold
    depends_on: [generate, sequence_screen]
    capabilities: [independent_fold_prediction, scaffold_and_catalytic_site_comparison]
    homodimer_capabilities: [independent_full_assembly_prediction, interface_evidence_assessment, per_chain_and_site_checks]
    entry_requirement: eligible_sequences_and_compatible_prediction_method;_independent_sequence_prediction_does_not_require_repaired_generated_coordinates
    exit_requirement: reviewed_independent_sequence_bound_assessment_models_for_every_candidate;_method_controls_and_integrity_required;_preparation_alone_is_insufficient;_downstream_evidence_uses_reviewed_model_versions
    output: 03_folds
  - id: aggregation
    depends_on: [fold]
    capabilities: [structural_aggregation_and_hotspot_assessment]
    homodimer_capabilities: [assembled_surface_assessment, profile_defined_dissociated_surface_assessment]
    entry_requirement: mapped_structures_and_applicable_property_methods
    output: 04_properties
  - id: complex
    depends_on: [aggregation]
    capabilities: [enzyme_substrate_complex_prediction, reactive_pose_assessment]
    entry_requirement: screened_assembly_without_known_disqualifying_failure_and_prepared_substrate
    output: 05_complexes
  - id: catalytic_states
    depends_on: [complex]
    capabilities: [state_ensemble_assessment, protonation_assessment, catalytic_geometry_evaluation]
    entry_requirement: mapped_complexes_and_evidence_backed_mechanistic_state_definitions
    output: 06_states
  - id: chemistry
    depends_on: [catalytic_states]
    capabilities: [conformational_sampling, coupled_quantum_mechanical_evaluation, profile_defined_energy_or_free_energy_validation]
    entry_requirement: prepared_states_and_control_tested_chemistry_method
    output: 07_chemistry
  - id: evaluate
    depends_on: [chemistry]
    capabilities: [independent_frozen_gate_evaluation, diversity_clustering_and_ranking]
    entry_requirement: current_evidence_and_full_profile_for_any_qualification_claim
    output: 08_results

assembly_contract:
  unique_sequences_per_candidate: 1
  length_basis: per_unique_sequence
  candidate_count_basis: complete_assembly
  biological_assembly_evidence: required
  chain_and_site_mapping: required
  homodimer_chain_sequences: identical
  state_symmetry_and_occupancy: profile_defined
  independent_assembly_evidence: required_for_homodimer
  average_cannot_hide_required_site_failure: true
  interface_confidence_is_catalysis: false
  qualification_scope: computational_only
  concentration_and_solution_domain: resolve_when_required_by_claim
  concentration_basis: explicit_when_concentration_supplied
  kinetic_comparison_basis: explicit_and_matched
  site_rules: state_specific
  prediction_templates_and_restraints: disclosed
  design_provenance_and_reference_similarity: required

refinement:
  capabilities: [constrained_structure_refinement, constrained_sequence_refinement]
  new_candidate_id: required
  preserve_fixed_catalytic_groups: true
  preserve_assembly_and_tied_sequences: true
  invalidate_changed_candidate_evidence: true

qualification:
  required_rule_combiner: all
  explicit_required_property_targets: each_bound_to_unchanged_required_rule_by_request_target_index
  chemical_path_coverage: directed_reactant_to_product_path_for_each_active_site
  evidence_must_be_current: true
  allowed_rule_states: [PASS, FAIL, UNRESOLVED]
  missing_raw_value: null
  unresolved_can_qualify: false
  fail_can_qualify: false
  score_compensation_across_hard_rules: false
  return_failed_to_fill_shortlist: false
  scientific_qualification_status: QUALIFIED
  reportable_outcome_statuses: [QUALIFIED, PARTIAL, NO_QUALIFYING_DESIGNS]

controller:
  default_mode: fixed
  implemented_modes: [fixed]
  supported_modes: [fixed]
  specified_extension_modes: [rl_inference, rl_training]
  rl_learning_method: profile_defined_with_action_masking
  episode_unit: candidate_lineage
  training_split: development_only
  inference_policy: frozen
  held_out_policy: frozen
  actions: [generate, refine, evaluate_stage, discard, stop]
  immutable_to_policy: [reaction, catalytic_groups, assembly, chain_mapping, site_coverage, protocol, gates, reward_definition, required_stages, chemistry_reservation]
  reward:
    per_required_rule_positive_weight: true
    weight_sum: 1.0
    score_range: [0.0, 1.0]
    unresolved_potential_contribution: 0.0
    progress_coefficient: 0.1
    cost_coefficient: 0.1
    terminal_all_pass: 2.0
    terminal_verified_failure: -1.0
    terminal_incomplete: 0.0
    gamma: 1.0
    maximum_total_normalized_episode_cost: 1.0
  assembly_decisions:
    before_promotion: required
    evidence_and_reason: required
    missing_or_conflicting_evidence: unresolved
    technical_retry: bounded_by_frozen_policy
    method_switching_until_pass: forbidden
    reject_or_refine_verified_failure: true
  artifacts: 09_rl

budgets:
  source: resolved_request_run_policy_or_autonomy_fallback
  respect_stricter_allocation_and_entitlement_limits: true
  policy_limits_are_completion_estimates: false
  enforce_before_dispatch: true
  reserve_finalist_chemistry: true
  charge_retries: true
  setup_and_campaign_accounting: separate_within_explicit_total
  local_controller_limits: active_wall_time_attempts_and_subprocess_timeouts
  scientific_job_limits: existing_harness_reservation_and_metering_required
  remote_costs_inferred_from_local_process_time: false
  estimate_full_assembly_and_site_coverage: true
  relax_gates_when_exhausted: false

benchmark:
  baselines: [fixed_execution, rule_based_refinement, frozen_rl]
  equal_total_compute: true
  independent_frozen_evaluator: true
  held_out_training_forbidden: true
  report_rl_training_cost_separately: true
