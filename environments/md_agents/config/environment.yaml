schema_version: "1.0"
environment_id: md-agents
maturity: Specification
scientific_execution_included: false
qualified_profiles_included: false
contracts:
  specification: ENVIRONMENT_SPEC.md
  request: config/request.schema.json
  protocol: config/protocol.schema.json
  tasks: tasks/
  agents: agents/contracts.json
status_taxonomy: [PASS, FAIL, REVIEW, NEEDS_INPUT, PROTOCOL_REQUIRED, BLOCKED, UNRESOLVED]
failure_categories:
  - invalid_system
  - missing_parameter
  - unsupported_engine_or_model
  - numerical_instability
  - equilibration_failure
  - sampling_insufficiency
  - trajectory_corruption
  - analysis_failure
  - resource_failure
  - provenance_error
  - license_or_integrity_failure
  - runtime_error
reproducibility:
  record_engine_and_version: required
  record_topology_parameter_hashes: required
  record_seed_and_hardware: required
  independent_replicas_when_claimed: required
  online_resource_hash_and_license: required
